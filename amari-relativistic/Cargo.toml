[package]
name = "amari-relativistic"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Relativistic physics using geometric algebra for charged particle simulations"
repository = "https://github.com/justinelliottcobb/Amari"
homepage = "https://github.com/justinelliottcobb/Amari"
keywords = ["relativistic-physics", "geometric-algebra", "spacetime", "general-relativity", "particle-physics"]
categories = ["mathematics", "science", "simulation", "algorithms"]

[dependencies]
# Use a direct dependency instead of workspace inheritance so `default-features = false`
# is honored (Cargo ignores it unless the workspace dependency also sets it).
amari-core = { path = "../amari-core", version = "0.24.0", default-features = false, features = ["std", "phantom-types"] }
nalgebra = { workspace = true }
serde = { version = "1.0", features = ["derive"], optional = true }
num-traits = { workspace = true }
thiserror = { workspace = true }

# Formal verification (requires nightly)
creusot-contracts = { version = "0.8", optional = true }

[dev-dependencies]
approx = { workspace = true }
criterion = "0.8"


[features]
default = ["std", "phantom-types", "high-precision"]
std = []
serde-support = ["serde"]
# Phantom types for compile-time verification (works on stable)
phantom-types = []
# High-precision arithmetic using centralized precision types from amari-core
high-precision = ["amari-core/high-precision"]
# Native precision backend (rug for high-performance)
native-precision = ["amari-core/native-precision"]
# WASM precision backend (dashu for portability)
wasm-precision = ["amari-core/wasm-precision"]
# Formal verification with Creusot (requires nightly)
formal-verification = ["creusot-contracts", "phantom-types"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]