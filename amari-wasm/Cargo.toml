[package]
name = "amari-wasm"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings for Amari mathematical computing library - geometric algebra, tropical algebra, automatic differentiation, measure theory, fusion systems, and information geometry"
repository = "https://github.com/Industrial-Algebra/Amari"
homepage = "https://github.com/Industrial-Algebra/Amari"
keywords = ["wasm", "webassembly", "geometric-algebra", "tropical-algebra", "autodiff"]
categories = ["mathematics", "science", "wasm", "web-programming"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Core WASM dependencies
#
# TOOLCHAIN PIN — these versions are exact on purpose.  Cargo.lock is
# gitignored, so every checkout (and every CI run) resolves fresh; a caret
# range would silently pick up a newer wasm-bindgen and change the emitted
# TypeScript surface (e.g. wasm-bindgen 0.2.130 widened slice parameters from
# `Float64Array` to `Float64Array | number[]`), which desynchronizes
# amari-discovery/catalog/generated-wasm.json from the committed artifact.
#
# Bumping any of these is a DELIBERATE change: bump the versions here AND the
# WASM_BINDGEN_VERSION / WASM_PACK_VERSION pair in .github/workflows/ci.yml,
# then regenerate BOTH amari-discovery/catalog/generated-wasm.json and
# amari-discovery/catalog/manifest.json (the manifest embeds the surface
# source_hash) in the same PR.
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
nalgebra = { workspace = true }
fastrand = "2.0"
getrandom = { version = "0.4", features = ["wasm_js"] }

# Amari dependencies - now WASM-compatible by default
# Note: high-precision now uses pure Rust dashu-float (WASM-compatible)
# Native users can opt-in to native-precision for rug backend
amari-core = { path = "../amari-core", features = ["phantom-types"] }
amari-cgt = { path = "../amari-cgt" }
amari-surreal = { path = "../amari-surreal", features = ["experimental-epsilon"] }
amari-surcomplex = { path = "../amari-surcomplex" }
amari-network = { path = "../amari-network", features = ["high-precision"] }
amari-tropical = { path = "../amari-tropical" }
amari-dual = { path = "../amari-dual" }
amari-fusion = { path = "../amari-fusion" }
amari-holographic = { path = "../amari-holographic" }
amari-automata = { path = "../amari-automata" }
amari-info-geom = { path = "../amari-info-geom" }
amari-enumerative = { path = "../amari-enumerative" }
amari-relativistic = { path = "../amari-relativistic", features = ["phantom-types"] }
amari-optimization = { path = "../amari-optimization", features = ["wasm"] }
amari-measure = { path = "../amari-measure" }
amari-calculus = { path = "../amari-calculus" }
amari-probabilistic = { path = "../amari-probabilistic" }
amari-functional = { path = "../amari-functional" }
amari-topology = { path = "../amari-topology" }
amari-flynn = { path = "../amari-flynn" }

# Additional dependencies for v0.9.4 complete WASM coverage
num-rational = "0.4"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
# Pinned with wasm-bindgen above (0.2.130 pairs with web-sys 0.3.107).
version = "=0.3.107"
features = [
    "console",
    "Performance",
    "Window",
]

[dev-dependencies]
# Pinned with wasm-bindgen above (0.2.130 pairs with wasm-bindgen-test 0.3.80).
wasm-bindgen-test = "=0.3.80"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false