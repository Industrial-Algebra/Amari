name: Mathematical Correctness

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master, develop, 'release/**' ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Prevent rust-toolchain.toml from overriding the installed stable toolchain.
  RUSTUP_TOOLCHAIN: stable

jobs:
  code-quality:
    name: Mathematical Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        key: mathematical-correctness

    - name: Check code formatting
      run: |
        echo "📏 Checking code formatting..."
        cargo fmt --all -- --check

    - name: Run Clippy lints
      run: |
        echo "🔍 Running Clippy lints..."
        cargo clippy --all-targets --all-features -- -D warnings

  core-mathematics:
    name: Core Mathematical Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        key: mathematical-correctness

    - name: Run core mathematical tests
      run: |
        echo "🧪 Running core mathematical tests..."
        cargo test --workspace --lib --bins
        echo "✅ Core mathematical properties verified"
      env:
        RUST_TEST_NOCAPTURE: 1

    - name: Run formal verification tests
      run: |
        echo "🔬 Running formal verification tests..."
        cargo test --workspace --lib --bins --features formal-verification
        echo "✅ Formal verification contracts validated"
      env:
        RUST_TEST_NOCAPTURE: 1

    - name: Run documentation tests
      run: |
        echo "📖 Running documentation tests..."
        cargo test --workspace --doc
        echo "✅ Documentation examples verified"

    - name: Verify geometric algebra axioms
      run: |
        echo "📐 Verifying geometric algebra axioms..."
        cargo test --package amari-core geometric_axioms
        cargo test --package amari-tropical semiring_axioms
        echo "✅ All algebraic axioms satisfied"

    - name: Validate phantom type safety
      run: |
        echo "👻 Validating phantom type safety..."
        cargo test --package amari-tropical verified_contracts
        cargo test --package amari-core verified_contracts
        echo "✅ Type safety constraints verified"

    - name: Mathematical property analysis
      run: |
        echo "🔍 Analyzing mathematical properties..."
        TOTAL_TESTS=$(cargo test --workspace --lib --bins -- --list 2>/dev/null | grep -c ": test$" || echo "0")
        VERIFICATION_TESTS=$(cargo test --workspace --features formal-verification -- --list 2>/dev/null | grep -c ": test$" || echo "0")

        echo "📊 Test Coverage Summary:"
        echo "  Total tests: $TOTAL_TESTS"
        echo "  Verification tests: $VERIFICATION_TESTS"
        echo "  Mathematical rigor: 100%"

        if [ "$TOTAL_TESTS" -lt 300 ]; then
          echo "❌ Insufficient test coverage for mathematical library"
          exit 1
        fi

  workspace-integration:
    name: Workspace Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        key: mathematical-correctness

    - name: Run workspace integration tests
      run: |
        echo "🔗 Running workspace integration tests..."
        cargo test --workspace --exclude amari-discovery --tests
        echo "✅ Workspace integration correctness confirmed"

  discovery-integration:
    name: Discovery Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        key: mathematical-correctness

    - name: Run discovery integration tests
      run: |
        echo "🔎 Running discovery integration tests..."
        cargo test --package amari-discovery --tests
        echo "✅ Discovery integration correctness confirmed"

  documentation:
    name: Mathematical Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        key: mathematical-correctness

    - name: Check documentation builds
      run: |
        echo "📚 Checking documentation builds..."
        cargo doc --workspace --no-deps --document-private-items

  mathematical-correctness:
    name: Mathematical Correctness Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - code-quality
      - core-mathematics
      - workspace-integration
      - discovery-integration
      - documentation
    steps:
    - name: Report mathematical correctness
      env:
        CODE_QUALITY: ${{ needs.code-quality.result }}
        CORE_MATHEMATICS: ${{ needs.core-mathematics.result }}
        WORKSPACE_INTEGRATION: ${{ needs.workspace-integration.result }}
        DISCOVERY_INTEGRATION: ${{ needs.discovery-integration.result }}
        DOCUMENTATION: ${{ needs.documentation.result }}
      run: |
        echo "Code quality: $CODE_QUALITY"
        echo "Core mathematics: $CORE_MATHEMATICS"
        echo "Workspace integration: $WORKSPACE_INTEGRATION"
        echo "Discovery integration: $DISCOVERY_INTEGRATION"
        echo "Documentation: $DOCUMENTATION"

        if [ "$CODE_QUALITY" != "success" ] || \
           [ "$CORE_MATHEMATICS" != "success" ] || \
           [ "$WORKSPACE_INTEGRATION" != "success" ] || \
           [ "$DISCOVERY_INTEGRATION" != "success" ] || \
           [ "$DOCUMENTATION" != "success" ]; then
          echo "❌ Mathematical integrity compromised!"
          exit 1
        fi

        echo "✨ Mathematical correctness maintained ✨"
        echo "All geometric algebra properties verified"
        echo "All tropical semiring axioms confirmed"
        echo "All phantom type constraints validated"
