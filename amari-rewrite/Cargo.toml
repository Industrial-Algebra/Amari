[package]
name = "amari-rewrite"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Abstract and term rewriting systems for the Amari library"
repository = "https://github.com/justinelliottcobb/Amari"
homepage = "https://github.com/justinelliottcobb/Amari"
keywords = ["mathematics", "rewriting", "trs", "rules", "synthesis"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
thiserror = { workspace = true }
# serde is declared directly (not workspace-inherited) so `serialize`
# stays no_std-correct: the workspace serde enables std, which would
# defeat no-default builds.
serde = { version = "1.0", optional = true, default-features = false, features = ["derive", "alloc"] }
sha2 = { workspace = true }
amari-network = { workspace = true, optional = true }
amari-holographic = { workspace = true, optional = true }
amari-rewrite-macros = { workspace = true, optional = true }
# NOTE 2026-10-16: candle-core/candle-nn optional deps REMOVED — they were
# pre-declared in #242 for neural-backend work that never consumed them (zero
# imports), and their transitive `zip ^8.6.0` requirement became unsatisfiable
# when zip's entire 8.x line was yanked from crates.io, breaking every
# `--all-features` CI resolution without a single line of code being involved.
#
# ADOPTED 2026-10-26 (Task 40, operator decision): the neural backend is
# Katakuri 0.2.0 (model/weight layer: `MlpSpec`, canonical tensor order — it
# never computes) over borsalino-tensor (typed tensor op-set + CPU T1
# reference: matmul/add/…). Both are consumed for real below, which is what
# the removed note demanded: no pre-declared, unconsumed dependency.
#
# The borsalino-tensor git dep is TEMPORARY BY DESIGN: it is refined by the
# requirements Amari discovers (Cohort 8) and publishes as part of a
# Borsalino 0.9.0 release; Amari switches to the version dep before the
# 0.25.0 release, because git dependencies block `cargo publish`.
katakuri = { version = "0.2.0", optional = true }
borsalino-tensor = { git = "https://github.com/Industrial-Algebra/Borsalino.git", branch = "develop", optional = true }
z3 = { version = "=0.20.2", default-features = false, features = ["vendored"], optional = true }

[features]
default = ["std"]
std = []
serialize = ["dep:serde"]
# Bounded Knuth-Bendix completion (Task 33). Non-default: the module
# is experimental and adds no runtime dependencies.
completion = []
macros = ["dep:amari-rewrite-macros"]
smt = ["std", "dep:z3"]
neural = ["std", "dep:katakuri", "dep:borsalino-tensor"]
network = ["std", "neural", "dep:amari-network"]
holographic-guidance = ["std", "dep:amari-holographic"]

[dev-dependencies]
serde_json = { workspace = true }
