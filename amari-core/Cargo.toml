[package]
name = "amari-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Core geometric algebra and mathematical structures"
repository = "https://github.com/justinelliottcobb/Amari"
homepage = "https://github.com/justinelliottcobb/Amari"
keywords = ["geometric-algebra", "clifford-algebra", "mathematics", "linear-algebra", "multivector"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
num-traits = { version = "0.2", default-features = false }
approx = { workspace = true }
rayon = { workspace = true, optional = true }
bytemuck = { workspace = true }
# Target-side float dispatch (P-EMBED S2b): the std-only transcendental
# methods route through libm on no-std targets. Same lock version as
# num-traits' optional edge (0.2.16) — zero new resolution; inert on
# host std builds (cfg-gated use in src/math_dispatch.rs).
libm = "0.2"
thiserror = { version = "2", default-features = false }
serde = { workspace = true, optional = true }
rug = { version = "1.24", optional = true }
dashu-float = { version = "0.4.3", optional = true, default-features = false }

# Formal verification (requires nightly)
creusot-contracts = { version = "0.8", optional = true }

[dev-dependencies]
num-traits = { workspace = true }
num-bigint = "0.4"
proptest = "1.4"
criterion = "0.8"
rand = "0.10"

[features]
default = ["std", "phantom-types", "high-precision", "gf2"]
std = ["num-traits/std", "thiserror/std", ]
serialize = ["serde"]
parallel = ["rayon"]
# Phantom types for compile-time verification (works on stable)
phantom-types = ["num-traits/libm"]
# High-precision arithmetic (pure Rust, WASM-compatible)
high-precision = ["dep:dashu-float", "dashu-float/std"]
# WASM-compatible high-precision (alias for high-precision)
wasm-precision = ["high-precision"]
# Native high-precision (rug backend, maximum performance, native-only)
native-precision = ["dep:rug"]
# Maximum precision (includes both backends for auto-selection)
full-precision = ["high-precision", "native-precision"]
# Formal verification with Creusot (requires nightly)
gf2 = []
formal-verification = ["creusot-contracts", "phantom-types"]

[[bench]]
name = "performance_suite"
harness = false