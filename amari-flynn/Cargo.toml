[package]
name = "amari-flynn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors = ["Justin Elliott Cobb <justin@industrialalgebra.com>"]
repository = "https://github.com/justinelliottcobb/Amari"
description = "Probabilistic contracts and verification - named after Kevin Flynn's acceptance of spontaneous perfection"
keywords = ["probability", "verification", "contracts", "statistics", "formal-methods"]
categories = ["mathematics", "science", "development-tools"]

[dependencies]
amari-flynn-macros = { workspace = true }
libm = "0.2"
rand = { workspace = true }
rand_distr = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
criterion = "0.8"
proptest = "1.0"

[features]
default = ["std"]
std = ["alloc"]
alloc = []
# Solver round-trip tests: require a z3 binary on PATH or at
# ~/.local/share/creusot/bin/z3 (audit contract U2, matrix point 4).
z3-tests = []
# geometric = ["amari"]  # TODO: Re-enable when geometric integration is implemented

# Benchmark will be added later
# [[bench]]
# name = "verification_perf"
# harness = false
