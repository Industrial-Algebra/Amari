# ---------------------------------------------------------------------------
# Geometric, holographic, and hybrid inverse guidance (0.25 Cohort 9, Task 49)
# — experimental metadata.
#
# These six capabilities describe the opt-in `amari-rewrite` geometric
# (`network`), holographic (`holographic-guidance`), and hybrid (`any(neural,
# holographic-guidance)`) guidance backends: the exact state embedding, the
# inverse search graph, the geometric strategy, trace encoding, trace recall,
# and the hybrid strategy that combines the lanes. Discovery curates metadata
# only. No probe is declared here, and `amari-discovery` enables none of these
# features, so no Katakuri, borsalino-tensor, or `amari-network`/`amari-
# holographic` binding enters this crate's graph beyond what it already links.
# The catalog consequently never stores model weights, optimizer state, replay
# certificates, recall vectors, or raw traces: those are caller-owned runtime
# data. Ordering guidance never creates a transition; the symbolic inverse
# engine keeps that authority.
# ---------------------------------------------------------------------------

