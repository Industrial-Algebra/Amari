# ---------------------------------------------------------------------------
# Neural inverse guidance (0.25 Cohort 8, Task 45) — experimental metadata.
#
# These five capabilities describe the opt-in `amari-rewrite` `neural`
# backend: the frozen candidate feature schema, the MLP ranker that orders
# already-valid candidates, its deterministic pairwise-hinge training, the
# validated ranker checkpoint, and the inverse-search strategy that binds
# them together. Discovery curates the metadata only: no probe is declared
# and `amari-discovery` never enables the `neural` feature, so no Katakuri or
# borsalino-tensor dependency enters this crate's graph. Ordering guidance
# never creates a transition; the symbolic inverse engine keeps that
# authority.
# ---------------------------------------------------------------------------

[[capabilities]]
